name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: bearinghealthmonitor-age6fwgzcte2grbs.azurecr.io
      IMAGE: bearinghealthmonitor-age6fwgzcte2grbs.azurecr.io/bearing-health-monitor
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: >
          docker build
          --build-arg COMMIT_SHA=${{ github.sha }}
          -t "$IMAGE:${{ github.sha }}"
          -t "$IMAGE:latest"
          .
      # Only main may push: the federated credential in Azure trusts refs/heads/main only.
      - name: Log in to Azure
        if: env.PUBLISH == 'true'
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Log in to the registry
        if: env.PUBLISH == 'true'
        run: az acr login --name "$REGISTRY"
      - name: Push image
        if: env.PUBLISH == 'true'
        run: docker push --all-tags "$IMAGE"
      - name: Deploy to Container Apps
        if: env.PUBLISH == 'true'
        run: >
          az containerapp update
          --name bearing-health-monitor
          --resource-group rg-bearing-health-monitor
          --image "$IMAGE:${{ github.sha }}"
      # Fail the run unless the live app reports this commit, i.e. the new revision took over.
      - name: Check live version
        if: env.PUBLISH == 'true'
        run: |
          fqdn=$(az containerapp show \
            --name bearing-health-monitor \
            --resource-group rg-bearing-health-monitor \
            --query properties.configuration.ingress.fqdn -o tsv)
          for attempt in $(seq 1 12); do
            commit=$(curl -fsS --max-time 10 "https://$fqdn/api/version" | jq -r .commit) || true
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "Attempt $attempt: live app reports $commit, deploy confirmed"
              exit 0
            fi
            echo "Attempt $attempt: live app reports '${commit}', waiting for $GITHUB_SHA"
            sleep 10
          done
          exit 1
