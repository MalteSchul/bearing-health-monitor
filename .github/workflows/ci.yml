name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: bearinghealthmonitor-age6fwgzcte2grbs.azurecr.io
      IMAGE: bearinghealthmonitor-age6fwgzcte2grbs.azurecr.io/bearing-health-monitor
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
      # Only main may push: the federated credential in Azure trusts refs/heads/main only.
      - if: env.PUBLISH == 'true'
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - if: env.PUBLISH == 'true'
        run: az acr login --name "$REGISTRY"
      - if: env.PUBLISH == 'true'
        run: docker push --all-tags "$IMAGE"
